<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Sudoku</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #1e1b2e;
      color: #f3effe;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #28243d;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    canvas {
      border-radius: 8px;
      background: #fff;
      touch-action: none;
    }
    .controls {
      margin-top: 12px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: #8a63d2;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background: #a07ae6;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="480" height="600"></canvas>
    <div class="controls">
      <button onclick="resetLevel()">Restart Level</button>
      <button onclick="toggleAudio()">🔊 Audio On/Off</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
