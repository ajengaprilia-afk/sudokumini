<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sudoku Mini</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #14121e;
      color: #f3effe;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #201c31;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(138, 99, 210, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    canvas {
      border-radius: 12px;
      background: #ffffff;
      touch-action: none;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
    }
    .action-panel {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: space-between;
    }
    .btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: #7c5295;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #9364af;
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn-secondary {
      background: #393252;
      color: #d0c8ec;
    }
    .btn-secondary:hover {
      background: #4a4269;
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <canvas id="gameCanvas" width="480" height="620"></canvas>
    <div class="action-panel">
      <button class="btn btn-secondary" onclick="resetLevel()">Restart Level</button>
      <button class="btn" id="audioToggleBtn" onclick="toggleAudio()">🔊 Audio On</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
